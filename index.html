<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bouquet For You 💐</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #ffe6ff 0%, #f7d5ff 35%, #1a1b3a 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      padding: 24px;
    }

    .card {
      width: 380px;
      padding: 24px 24px 30px;
      background: rgba(10, 13, 40, 0.95);
      border-radius: 24px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.16), transparent);
      top: -90px;
      right: -60px;
      filter: blur(2px);
    }

    .message h1 {
      font-size: 26px;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .message p {
      font-size: 14px;
      opacity: 0.85;
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .bouquet {
      margin-top: 10px;
      width: 100%;
      height: 260px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    /* stems */
    .stem {
      position: absolute;
      bottom: 45px;
      width: 4px;
      height: 140px;
      background: linear-gradient(to bottom, #4fd18a, #106b3f);
      border-radius: 999px;
      transform-origin: bottom center;
      z-index: 0;
    }

    .stem1 { left: 120px; transform: rotate(-8deg); }
    .stem2 { left: 160px; }
    .stem3 { left: 200px; transform: rotate(8deg); }

    /* flowers */
    .flower {
      position: absolute;
      bottom: 130px;
      width: 90px;
      height: 90px;
      transform-origin: bottom center;
      animation: sway 4s ease-in-out infinite;
      z-index: 3;
    }

    .flower1 { left: 95px; animation-delay: -0.4s; }
    .flower2 { left: 155px; animation-delay: -1.1s; }
    .flower3 { left: 215px; animation-delay: -0.8s; }

    .petal {
      position: absolute;
      width: 38px;
      height: 70px;
      border-radius: 40px 40px 10px 40px;
      top: 10px;
      left: 26px;
      transform-origin: bottom center;
      box-shadow: 0 6px 10px rgba(0, 0, 0, 0.25);
    }

    /* Different flower colors */
    .flower1 .petal {
      background: linear-gradient(145deg, #ff9ad5, #ff5fa8);
    }
    .flower2 .petal {
      background: linear-gradient(145deg, #ffe38b, #ffb347);
    }
    .flower3 .petal {
      background: linear-gradient(145deg, #9ee0ff, #4ab0ff);
    }

    .petal1 { transform: rotate(0deg); }
    .petal2 { transform: rotate(60deg); }
    .petal3 { transform: rotate(120deg); }
    .petal4 { transform: rotate(180deg); }
    .petal5 { transform: rotate(240deg); }
    .petal6 { transform: rotate(300deg); }

    .center {
      position: absolute;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff9c7, #f7c840);
      top: 30px;
      left: 31px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    /* bouquet wrap */
    .wrap {
      position: absolute;
      bottom: -10px;
      left: 50%;
      width: 150px;
      height: 150px;
      transform: translateX(-50%) rotate(45deg);
      background: linear-gradient(135deg, #f7f7ff, #ffd5f5);
      border-radius: 36px 36px 110px 110px;
      box-shadow: 0 18px 35px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      z-index: 1;
    }

    .wrap::before {
      content: "";
      position: absolute;
      inset: 20px;
      border-radius: 32px 32px 90px 90px;
      border: 1px dashed rgba(255, 255, 255, 0.5);
      opacity: 0.85;
    }

    /* tiny ribbon */
    .ribbon {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      height: 20px;
      background: linear-gradient(90deg, #ff5fa8, #ffb347);
      border-radius: 999px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      z-index: 4;
    }

    .ribbon::before,
    .ribbon::after {
      content: "";
      position: absolute;
      width: 32px;
      height: 28px;
      background: inherit;
      bottom: -18px;
      clip-path: polygon(0 0, 100% 0, 60% 100%, 0 65%);
      opacity: 0.9;
    }

    .ribbon::before { left: -8px; transform: rotate(-12deg); }
    .ribbon::after  { right: -8px; transform: scaleX(-1) rotate(-12deg); }

    /* floating hearts */
    .heart {
      position: absolute;
      font-size: 18px;
      opacity: 0.75;
      animation: floatUp 5s ease-in-out infinite;
      z-index: 5;
    }

    .heart.h1 { left: 40px; bottom: 40px; animation-delay: 0s; }
    .heart.h2 { right: 40px; bottom: 30px; animation-delay: -2s; }
    .heart.h3 { left: 120px; bottom: 70px; animation-delay: -3s; }

    @keyframes sway {
      0%   { transform: rotate(-3deg) translateY(0); }
      50%  { transform: rotate(3deg) translateY(-10px); }
      100% { transform: rotate(-3deg) translateY(0); }
    }

    @keyframes floatUp {
      0%   { transform: translateY(0); opacity: 0; }
      20%  { opacity: 0.9; }
      100% { transform: translateY(-60px); opacity: 0; }
    }

    /* -------- MOBILE VIEW -------- */
    @media (max-width: 600px) {
      body {
        padding: 16px;
      }

      .card {
        width: 100%;
        max-width: 360px;
        padding: 20px 16px 24px;
        border-radius: 20px;
      }

      .message h1 {
        font-size: 22px;
      }

      .message p {
        font-size: 13px;
      }

      .bouquet {
        height: 230px;
      }

      .stem {
        height: 120px;
        bottom: 40px;
      }

      .flower {
        width: 74px;
        height: 74px;
        bottom: 120px;
      }

      .petal {
        width: 30px;
        height: 56px;
        left: 22px;
        top: 8px;
      }

      .center {
        width: 22px;
        height: 22px;
        top: 24px;
        left: 25px;
      }

      .wrap {
        width: 125px;
        height: 125px;
        bottom: -8px;
      }

      .ribbon {
        width: 60px;
        height: 18px;
        bottom: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="message">
      <h1>For You 💐</h1>
      <p>I hope this boque…<br>Impresses my Shawtyy ✨</p>
    </div>

    <div class="bouquet">
      <!-- stems -->
      <div class="stem stem1"></div>
      <div class="stem stem2"></div>
      <div class="stem stem3"></div>

      <!-- flowers -->
      <div class="flower flower1">
        <div class="center"></div>
        <div class="petal petal1"></div>
        <div class="petal petal2"></div>
        <div class="petal petal3"></div>
        <div class="petal petal4"></div>
        <div class="petal petal5"></div>
        <div class="petal petal6"></div>
      </div>

      <div class="flower flower2">
        <div class="center"></div>
        <div class="petal petal1"></div>
        <div class="petal petal2"></div>
        <div class="petal petal3"></div>
        <div class="petal petal4"></div>
        <div class="petal petal5"></div>
        <div class="petal petal6"></div>
      </div>

      <div class="flower flower3">
        <div class="center"></div>
        <div class="petal petal1"></div>
        <div class="petal petal2"></div>
        <div class="petal petal3"></div>
        <div class="petal petal4"></div>
        <div class="petal petal5"></div>
        <div class="petal petal6"></div>
      </div>

      <!-- wrap & ribbon -->
      <div class="wrap"></div>
      <div class="ribbon"></div>

      <!-- hearts -->
      <div class="heart h1">💖</div>
      <div class="heart h2">💕</div>
      <div class="heart h3">💗</div>
    </div>
  </div>
</body>
</html>
